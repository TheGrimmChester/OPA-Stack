# All-products stack — one ClickHouse server, product databases (OPA/ORA/OSA/OPL/OAM; OPM is filesystem-backed).
# Laptop smoke only. Production/NAS must use *:nas image tags exclusively.
#
# Databases created on first boot: opa, ora, osa, opl, oam (see clickhouse/init-databases.sql).
# Co-deployed auth: set JWT_SECRET shared across services and PEER_OPA_URL=http://hub:8080
# so ORA/OSA/OPL/OPM validate hub-issued tokens. Standalone: leave PEER_OPA_URL empty
# (or AUTH_MODE=standalone) for local /api/auth/login on each product.
name: open-family

services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    ports: ["8123:8123"]
    environment:
      # Without this the image provisions `default` with a password the services
      # do not send, and every query returns 403 "Authentication failed" while
      # each /api/health still reports ok — the stack looks up and is unusable.
      # compose.nas.yaml has always set it; this file was missing it.
      CLICKHOUSE_SKIP_USER_SETUP: "1"
    volumes:
      - ./clickhouse/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
      - clickhouse_data:/var/lib/clickhouse
    # Every product bootstraps its schema once at boot and does not retry. Plain
    # `depends_on: [clickhouse]` only waits for the container to start, so that
    # bootstrap raced the server and lost: services came up healthy against an
    # empty database and every read failed with UNKNOWN_TABLE. The consumers
    # below gate on this healthcheck instead.
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 5s
      timeout: 3s
      retries: 30

  redis-opa: &redis_security
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_OPA_PASSWORD:-dev-redis-opa-at-least-16b}
    command:
      - redis-server
      - --requirepass
      - ${REDIS_OPA_PASSWORD:-dev-redis-opa-at-least-16b}
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
      - --appendonly
      - "yes"
      - --rename-command
      - FLUSHALL
      - ""
      - --rename-command
      - CONFIG
      - ""
      - --rename-command
      - DEBUG
      - ""
    volumes:
      - redis_opa_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis-oam:
    <<: *redis_security
    environment:
      REDIS_PASSWORD: ${REDIS_OAM_PASSWORD:-dev-redis-oam-at-least-16b}
    command:
      - redis-server
      - --requirepass
      - ${REDIS_OAM_PASSWORD:-dev-redis-oam-at-least-16b}
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
      - --appendonly
      - "yes"
      - --rename-command
      - FLUSHALL
      - ""
      - --rename-command
      - CONFIG
      - ""
      - --rename-command
      - DEBUG
      - ""
    volumes:
      - redis_oam_data:/data

  redis-ora:
    <<: *redis_security
    environment:
      REDIS_PASSWORD: ${REDIS_ORA_PASSWORD:-dev-redis-ora-at-least-16b}
    command:
      - redis-server
      - --requirepass
      - ${REDIS_ORA_PASSWORD:-dev-redis-ora-at-least-16b}
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
      - --appendonly
      - "yes"
      - --rename-command
      - FLUSHALL
      - ""
      - --rename-command
      - CONFIG
      - ""
      - --rename-command
      - DEBUG
      - ""
    volumes:
      - redis_ora_data:/data

  redis-osa:
    <<: *redis_security
    environment:
      REDIS_PASSWORD: ${REDIS_OSA_PASSWORD:-dev-redis-osa-at-least-16b}
    command:
      - redis-server
      - --requirepass
      - ${REDIS_OSA_PASSWORD:-dev-redis-osa-at-least-16b}
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
      - --appendonly
      - "yes"
      - --rename-command
      - FLUSHALL
      - ""
      - --rename-command
      - CONFIG
      - ""
      - --rename-command
      - DEBUG
      - ""
    volumes:
      - redis_osa_data:/data

  redis-opl:
    <<: *redis_security
    environment:
      REDIS_PASSWORD: ${REDIS_OPL_PASSWORD:-dev-redis-opl-at-least-16b}
    command:
      - redis-server
      - --requirepass
      - ${REDIS_OPL_PASSWORD:-dev-redis-opl-at-least-16b}
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
      - --appendonly
      - "yes"
      - --rename-command
      - FLUSHALL
      - ""
      - --rename-command
      - CONFIG
      - ""
      - --rename-command
      - DEBUG
      - ""
    volumes:
      - redis_opl_data:/data

  redis-opm:
    <<: *redis_security
    environment:
      REDIS_PASSWORD: ${REDIS_OPM_PASSWORD:-dev-redis-opm-at-least-16b}
    command:
      - redis-server
      - --requirepass
      - ${REDIS_OPM_PASSWORD:-dev-redis-opm-at-least-16b}
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
      - --appendonly
      - "yes"
      - --rename-command
      - FLUSHALL
      - ""
      - --rename-command
      - CONFIG
      - ""
      - --rename-command
      - DEBUG
      - ""
    volumes:
      - redis_opm_data:/data

  hub:
    image: opa-hub:smoke
    ports: ["8080:8080"]
    environment:
      LISTEN_ADDR: ":8080"
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_DB: opa
      # The hub serves /api/tenancy/organizations from OAM when this is set. Its
      # own fallback is the in-memory agent registry, which only knows orgs that
      # telemetry has arrived under and resets on restart.
      PEER_OAM_URL: http://oam:8090
      JWT_SECRET: ${JWT_SECRET:-dev-shared-jwt-secret-at-least-32b}
      AUTH_MODE: codeployed
      OPEN_SERVICE_JWT_SECRET: ${OPEN_SERVICE_JWT_SECRET:-dev-service-jwt-secret-at-least-32b}
      PEER_ORA_URL: http://ora:8091
      PEER_OSA_URL: http://osa:8093
      PEER_OPL_URL: http://opl:8092
      PEER_OPM_URL: http://opm:8096
      REDIS_URL: redis://:${REDIS_OPA_PASSWORD:-dev-redis-opa-at-least-16b}@redis-opa:6379/0
    depends_on:
      clickhouse:
        condition: service_healthy
      redis-opa:
        condition: service_healthy

  agent:
    image: opa-agent:smoke
    environment:
      OPA_HUB_URL: http://hub:8080

  opa-dashboard:
    image: opa-dashboard:smoke
    ports: ["8088:80"]
    environment:
      VITE_API_URL: http://127.0.0.1:8080

  ora:
    image: ora-api:smoke
    ports: ["8091:8091"]
    # Each dashboard's nginx proxies /api/ to `<product>-api` (the service name
    # compose.nas.yaml uses). This file names the backends `ora`/`osa`/…, so
    # without the alias every dashboard answered 502 on every API call while the
    # container itself looked healthy. Aliasing rather than renaming keeps the
    # PEER_*_URL values below working.
    networks:
      default:
        aliases: [ora-api]
    environment:
      LISTEN_ADDR: ":8091"
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_DB: ora
      JWT_SECRET: ${JWT_SECRET:-dev-shared-jwt-secret-at-least-32b}
      AUTH_MODE: codeployed
      OPEN_SERVICE_JWT_SECRET: ${OPEN_SERVICE_JWT_SECRET:-dev-service-jwt-secret-at-least-32b}
      PEER_OPA_URL: http://hub:8080
      PEER_OAM_URL: http://oam:8090
      PEER_OSA_URL: http://osa:8093
      PEER_OPL_URL: http://opl:8092
      PEER_OPM_URL: http://opm:8096
      # Post-install / claim browser redirects land on OAM Connectors (not OPA :8088).
      OAM_DASHBOARD_URL: ${OAM_DASHBOARD_URL:-http://127.0.0.1:8097}
      REDIS_URL: redis://:${REDIS_ORA_PASSWORD:-dev-redis-ora-at-least-16b}@redis-ora:6379/0
    depends_on:
      clickhouse:
        condition: service_healthy
      redis-ora:
        condition: service_healthy

  ora-orchestrator:
    image: ora-api:smoke
    command: ["ora-api", "orchestrator"]
    environment:
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_DB: ora
      JWT_SECRET: ${JWT_SECRET:-dev-shared-jwt-secret-at-least-32b}

  ora-dashboard:
    image: ora-dashboard:smoke
    ports: ["8089:80"]
    environment:
      VITE_API_URL: http://127.0.0.1:8091

  osa:
    image: osa-api:smoke
    ports: ["8093:8093"]
    networks:
      default:
        aliases: [osa-api]
    environment:
      LISTEN_ADDR: ":8093"
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_DB: osa
      JWT_SECRET: ${JWT_SECRET:-dev-shared-jwt-secret-at-least-32b}
      AUTH_MODE: codeployed
      OPEN_SERVICE_JWT_SECRET: ${OPEN_SERVICE_JWT_SECRET:-dev-service-jwt-secret-at-least-32b}
      PEER_OPA_URL: http://hub:8080
      PEER_ORA_URL: http://ora:8091
      # The dashboard's project picker reads /api/oam/projects, which proxies
      # OAM's directory. Organizations still come via the hub. Unset, the project
      # picker is empty rather than broken.
      PEER_OAM_URL: http://oam:8090
      REDIS_URL: redis://:${REDIS_OSA_PASSWORD:-dev-redis-osa-at-least-16b}@redis-osa:6379/0
    depends_on:
      clickhouse:
        condition: service_healthy
      redis-osa:
        condition: service_healthy

  osa-orchestrator:
    image: osa-api:smoke
    command: ["osa-api", "orchestrator"]
    environment:
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_DB: osa

  osa-dashboard:
    image: osa-dashboard:smoke
    ports: ["8094:80"]
    environment:
      VITE_API_URL: http://127.0.0.1:8093

  opl:
    image: opl-api:smoke
    ports: ["8092:8092"]
    networks:
      default:
        aliases: [opl-api]
    environment:
      LISTEN_ADDR: ":8092"
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_DB: opl
      JWT_SECRET: ${JWT_SECRET:-dev-shared-jwt-secret-at-least-32b}
      AUTH_MODE: codeployed
      OPEN_SERVICE_JWT_SECRET: ${OPEN_SERVICE_JWT_SECRET:-dev-service-jwt-secret-at-least-32b}
      PEER_OPA_URL: http://hub:8080
      PEER_OAM_URL: http://oam:8090
      OPL_RUN_WEBHOOK_URL: ${OPL_RUN_WEBHOOK_URL:-}
      OPL_RUN_NOTIFY_MODE: ${OPL_RUN_NOTIFY_MODE:-deliver}
      OPL_RUN_NOTIFY_STATUSES: ${OPL_RUN_NOTIFY_STATUSES:-}
      OPL_RUN_WEBHOOK_SECRET: ${OPL_RUN_WEBHOOK_SECRET:-}
      OPL_PUBLIC_URL: ${OPL_PUBLIC_URL:-}
      REDIS_URL: redis://:${REDIS_OPL_PASSWORD:-dev-redis-opl-at-least-16b}@redis-opl:6379/0
    depends_on:
      clickhouse:
        condition: service_healthy
      redis-opl:
        condition: service_healthy

  opl-orchestrator:
    image: opl-api:smoke
    command: ["opl-api", "orchestrator"]
    environment:
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_DB: opl

  opl-dashboard:
    image: opl-dashboard:smoke
    ports: ["8095:80"]
    environment:
      VITE_API_URL: http://127.0.0.1:8092

  # OAM — Open Account Manager. Orgs, users, connectors, API keys, AI provider
  # credentials and per-agent model bindings for the whole family.
  #
  # OAM_SECRET_KEY encrypts secrets at rest and must match the value ORA already
  # uses (OPA_CONNECTOR_SECRET): the migration copies ORA's ciphertext verbatim,
  # so a different key makes every migrated credential undecryptable. OAM accepts
  # OPA_CONNECTOR_SECRET as a fallback for exactly that reason.
  oam:
    image: oam-api:smoke
    ports: ["8090:8090"]
    networks:
      default:
        aliases: [oam-api]
    environment:
      LISTEN_ADDR: ":8090"
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_DB: oam
      JWT_SECRET: ${JWT_SECRET:-dev-shared-jwt-secret-at-least-32b}
      AUTH_MODE: codeployed
      # Required: credential resolution refuses to serve without it, because a
      # peer that cannot be authenticated must not receive plaintext keys.
      OPEN_SERVICE_JWT_SECRET: ${OPEN_SERVICE_JWT_SECRET:-dev-service-jwt-secret-at-least-32b}
      OAM_SECRET_KEY: ${OAM_SECRET_KEY:-${OPA_CONNECTOR_SECRET:-dev-connector-secret-at-least-32b}}
      PEER_OPA_URL: http://hub:8080
      # Directory project import discovers repos via ORA connectors.
      PEER_ORA_URL: http://ora:8091
      REDIS_URL: redis://:${REDIS_OAM_PASSWORD:-dev-redis-oam-at-least-16b}@redis-oam:6379/0
    depends_on:
      clickhouse:
        condition: service_healthy
      redis-oam:
        condition: service_healthy

  # The account console: directory, users, credentials, audit, and the
  # Agents & Models page that replaces the OPM_MODEL* environment variables.
  oam-dashboard:
    image: oam-dashboard:smoke
    ports: ["8097:80"]
    environment:
      VITE_API_URL: http://127.0.0.1:8090

  opm:
    image: opm-api:smoke
    ports: ["8096:8096"]
    networks:
      default:
        aliases: [opm-api]
    environment:
      LISTEN_ADDR: ":8096"
      JWT_SECRET: ${JWT_SECRET:-dev-shared-jwt-secret-at-least-32b}
      AUTH_MODE: codeployed
      OPEN_SERVICE_JWT_SECRET: ${OPEN_SERVICE_JWT_SECRET:-dev-service-jwt-secret-at-least-32b}
      PEER_OPA_URL: http://hub:8080
      PEER_ORA_URL: http://ora:8091
      # With PEER_OAM_URL set, jobs resolve their model AND API key per job from
      # OAM, scoped to the acting user's org and per-agent binding. Unset it and
      # OPM falls back to the deployment-wide OPM_MODEL*/CURSOR_API_KEY path.
      PEER_OAM_URL: http://oam:8090
      OPM_DATA_DIR: /data
      OPM_JOB_TMP: /tmp/opm-jobs
      REDIS_URL: redis://:${REDIS_OPM_PASSWORD:-dev-redis-opm-at-least-16b}@redis-opm:6379/0
    depends_on:
      redis-opm:
        condition: service_healthy

  opm-orchestrator:
    image: opm-api:smoke
    command: ["opm-api", "orchestrator"]
    environment:
      ORCHESTRATOR_LISTEN_ADDR: ":8099"
      OPM_RUNNER_TAG: smoke

  opm-dashboard:
    image: opm-dashboard:smoke
    ports: ["8098:80"]
    environment:
      VITE_API_URL: http://127.0.0.1:8096


volumes:
  clickhouse_data:
  redis_opa_data:
  redis_oam_data:
  redis_ora_data:
  redis_osa_data:
  redis_opl_data:
  redis_opm_data:
