# All-products stack — one ClickHouse server, product databases (OPA/ORA/OSA/OPL/OAM; OPM is filesystem-backed).
# Laptop smoke only. Production/NAS must use *:nas image tags exclusively.
#
# Databases created on first boot: opa, ora, osa, opl, oam (see clickhouse/init-databases.sql).
# Co-deployed auth: set JWT_SECRET shared across services and PEER_OPA_URL=http://hub:8080
# so ORA/OSA/OPL/OPM validate hub-issued tokens. Standalone: leave PEER_OPA_URL empty
# (or AUTH_MODE=standalone) for local /api/auth/login on each product.
name: open-family

services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    ports: ["8123:8123"]
    volumes:
      - ./clickhouse/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
      - clickhouse_data:/var/lib/clickhouse

  hub:
    image: opa-hub:smoke
    ports: ["8080:8080"]
    environment:
      LISTEN_ADDR: ":8080"
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_DB: opa
      # The hub serves /api/tenancy/organizations from OAM when this is set. Its
      # own fallback is the in-memory agent registry, which only knows orgs that
      # telemetry has arrived under and resets on restart.
      PEER_OAM_URL: http://oam:8090
      JWT_SECRET: ${JWT_SECRET:-dev-shared-jwt-secret-at-least-32b}
      AUTH_MODE: codeployed
      OPEN_SERVICE_JWT_SECRET: ${OPEN_SERVICE_JWT_SECRET:-dev-service-jwt-secret-at-least-32b}
      PEER_ORA_URL: http://ora:8091
      PEER_OSA_URL: http://osa:8093
      PEER_OPL_URL: http://opl:8092
      PEER_OPM_URL: http://opm:8096
    depends_on: [clickhouse]

  agent:
    image: opa-agent:smoke
    environment:
      OPA_HUB_URL: http://hub:8080

  opa-dashboard:
    image: opa-dashboard:smoke
    ports: ["8088:80"]
    environment:
      VITE_API_URL: http://127.0.0.1:8080

  ora:
    image: ora-api:smoke
    ports: ["8091:8091"]
    environment:
      LISTEN_ADDR: ":8091"
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_DB: ora
      JWT_SECRET: ${JWT_SECRET:-dev-shared-jwt-secret-at-least-32b}
      AUTH_MODE: codeployed
      OPEN_SERVICE_JWT_SECRET: ${OPEN_SERVICE_JWT_SECRET:-dev-service-jwt-secret-at-least-32b}
      PEER_OPA_URL: http://hub:8080
      PEER_OSA_URL: http://osa:8093
    depends_on: [clickhouse]

  ora-orchestrator:
    image: ora-api:smoke
    command: ["ora-api", "orchestrator"]
    environment:
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_DB: ora
      JWT_SECRET: ${JWT_SECRET:-dev-shared-jwt-secret-at-least-32b}

  ora-dashboard:
    image: ora-dashboard:smoke
    ports: ["8089:80"]
    environment:
      VITE_API_URL: http://127.0.0.1:8091

  osa:
    image: osa-api:smoke
    ports: ["8093:8093"]
    environment:
      LISTEN_ADDR: ":8093"
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_DB: osa
      JWT_SECRET: ${JWT_SECRET:-dev-shared-jwt-secret-at-least-32b}
      AUTH_MODE: codeployed
      OPEN_SERVICE_JWT_SECRET: ${OPEN_SERVICE_JWT_SECRET:-dev-service-jwt-secret-at-least-32b}
      PEER_OPA_URL: http://hub:8080
      PEER_ORA_URL: http://ora:8091
    depends_on: [clickhouse]

  osa-orchestrator:
    image: osa-api:smoke
    command: ["osa-api", "orchestrator"]
    environment:
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_DB: osa

  osa-dashboard:
    image: osa-dashboard:smoke
    ports: ["8094:80"]
    environment:
      VITE_API_URL: http://127.0.0.1:8093

  opl:
    image: opl-api:smoke
    ports: ["8092:8092"]
    environment:
      LISTEN_ADDR: ":8092"
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_DB: opl
      JWT_SECRET: ${JWT_SECRET:-dev-shared-jwt-secret-at-least-32b}
      AUTH_MODE: codeployed
      OPEN_SERVICE_JWT_SECRET: ${OPEN_SERVICE_JWT_SECRET:-dev-service-jwt-secret-at-least-32b}
      PEER_OPA_URL: http://hub:8080
      OPL_RUN_WEBHOOK_URL: ${OPL_RUN_WEBHOOK_URL:-}
      OPL_RUN_NOTIFY_MODE: ${OPL_RUN_NOTIFY_MODE:-deliver}
      OPL_RUN_NOTIFY_STATUSES: ${OPL_RUN_NOTIFY_STATUSES:-}
      OPL_RUN_WEBHOOK_SECRET: ${OPL_RUN_WEBHOOK_SECRET:-}
      OPL_PUBLIC_URL: ${OPL_PUBLIC_URL:-}
    depends_on: [clickhouse]

  opl-orchestrator:
    image: opl-api:smoke
    command: ["opl-api", "orchestrator"]
    environment:
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_DB: opl

  opl-dashboard:
    image: opl-dashboard:smoke
    ports: ["8095:80"]
    environment:
      VITE_API_URL: http://127.0.0.1:8092

  # OAM — Open Account Manager. Orgs, users, connectors, API keys, AI provider
  # credentials and per-agent model bindings for the whole family.
  #
  # OAM_SECRET_KEY encrypts secrets at rest and must match the value ORA already
  # uses (OPA_CONNECTOR_SECRET): the migration copies ORA's ciphertext verbatim,
  # so a different key makes every migrated credential undecryptable. OAM accepts
  # OPA_CONNECTOR_SECRET as a fallback for exactly that reason.
  oam:
    image: oam-api:smoke
    ports: ["8090:8090"]
    environment:
      LISTEN_ADDR: ":8090"
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_DB: oam
      JWT_SECRET: ${JWT_SECRET:-dev-shared-jwt-secret-at-least-32b}
      AUTH_MODE: codeployed
      # Required: credential resolution refuses to serve without it, because a
      # peer that cannot be authenticated must not receive plaintext keys.
      OPEN_SERVICE_JWT_SECRET: ${OPEN_SERVICE_JWT_SECRET:-dev-service-jwt-secret-at-least-32b}
      OAM_SECRET_KEY: ${OAM_SECRET_KEY:-${OPA_CONNECTOR_SECRET:-dev-connector-secret-at-least-32b}}
      PEER_OPA_URL: http://hub:8080
    depends_on: [clickhouse]

  # The account console: directory, users, credentials, audit, and the
  # Agents & Models page that replaces the OPM_MODEL* environment variables.
  oam-dashboard:
    image: oam-dashboard:smoke
    ports: ["8097:80"]
    environment:
      VITE_API_URL: http://127.0.0.1:8090

  opm:
    image: opm-api:smoke
    ports: ["8096:8096"]
    environment:
      LISTEN_ADDR: ":8096"
      JWT_SECRET: ${JWT_SECRET:-dev-shared-jwt-secret-at-least-32b}
      AUTH_MODE: codeployed
      OPEN_SERVICE_JWT_SECRET: ${OPEN_SERVICE_JWT_SECRET:-dev-service-jwt-secret-at-least-32b}
      PEER_OPA_URL: http://hub:8080
      PEER_ORA_URL: http://ora:8091
      PEER_OSA_URL: http://osa:8093
      PEER_OPL_URL: http://opl:8092
      # With PEER_OAM_URL set, jobs resolve their model AND API key per job from
      # OAM, scoped to the acting user's org and per-agent binding. Unset it and
      # OPM falls back to the deployment-wide OPM_MODEL*/CURSOR_API_KEY path.
      PEER_OAM_URL: http://oam:8090
      OPM_DATA_DIR: /data
      OPM_JOB_TMP: /tmp/opm-jobs

  opm-orchestrator:
    image: opm-api:smoke
    command: ["opm-api", "orchestrator"]
    environment:
      ORCHESTRATOR_LISTEN_ADDR: ":8099"
      OPM_RUNNER_TAG: smoke

  opm-dashboard:
    image: opm-dashboard:smoke
    ports: ["8098:80"]
    environment:
      VITE_API_URL: http://127.0.0.1:8096


volumes:
  clickhouse_data:
