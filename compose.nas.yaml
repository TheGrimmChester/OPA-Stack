# Open-* family — production / NAS compose.
# Image tags: *:nas only. Never deploy *:smoke on this host.
#
# Project name: open-family
# Typical path on NAS: /mnt/Apps/config-docker/open-stack
#   (legacy path /mnt/Apps/config-docker/opa may remain as a symlink)
#
# This is the only compose file for the production stack. Select it with
# COMPOSE_FILE=compose.nas.yaml in the stack .env and keep no second copy
# beside it — a directory holding two full stack definitions merges every
# service twice and drifts silently. See docs/nas-deploy.md, "Compose file set".
#
# ClickHouse data: reuses the pre-split volume by name (external) so production
# telemetry is not wiped when the compose project renames from opa-stack.
#
# Compatibility kept for existing app overlays:
#   - external network opa_network
#   - container_name opa_agent (Planner / PHP OPA_SOCKET_PATH)

name: open-family

services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    container_name: open_clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_SKIP_USER_SETUP: "1"
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    volumes:
      - ./clickhouse/init:/docker-entrypoint-initdb.d:ro
      - ./clickhouse/users.d:/etc/clickhouse-server/users.d:ro
      - ./clickhouse/config.d:/etc/clickhouse-server/config.d:ro
      - clickhouse_data:/var/lib/clickhouse
    ports:
      - "8123:8123"
    networks:
      - open_internal
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  hub:
    image: opa-hub:nas
    container_name: open_hub
    restart: unless-stopped
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      LISTEN_ADDR: ":8080"
      CLICKHOUSE_URL: "http://clickhouse:8123"
      CLICKHOUSE_DB: opa
      # Organizations come from the OAM directory when this is set; the in-memory
      # agent registry is the fallback (it only knows orgs telemetry arrived
      # under, and resets on restart).
      PEER_OAM_URL: http://oam-api:8090
      JWT_SECRET: ${JWT_SECRET}
      AUTH_MODE: ${AUTH_MODE:-codeployed}
      # Prefer a distinct service secret from JWT_SECRET (set OPEN_SERVICE_JWT_SECRET in .env).
      OPEN_SERVICE_JWT_SECRET: ${OPEN_SERVICE_JWT_SECRET}
      OPA_HUB_ENROLL_TOKEN: ${OPA_HUB_ENROLL_TOKEN:-}
      OPA_AUTH_REQUIRED: ${OPA_AUTH_REQUIRED:-1}
      PEER_ORA_URL: http://ora-api:8091
      PEER_OSA_URL: http://osa-api:8093
      PEER_OPL_URL: http://opl-api:8092
      PEER_OPM_URL: http://opm-api:8096
    ports:
      # Host 8080 is taken (CoreDNS); keep the historical public OPA API port.
      - "18080:8080"
    networks:
      - open_internal
      - opa_network
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/api/health"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Edge agent — keep container DNS name opa_agent for app overlays.
  opa_agent:
    image: opa-agent:nas
    container_name: opa_agent
    restart: unless-stopped
    depends_on:
      hub:
        condition: service_healthy
    environment:
      TRANSPORT_TCP: ":9090"
      WS_PORT: "8082"
      JWT_SECRET: ${JWT_SECRET}
      OPA_AUTH_REQUIRED: ${OPA_AUTH_REQUIRED:-1}
      OPA_WS_ALLOWED_ORIGINS: ${OPA_WS_ALLOWED_ORIGINS}
      OPA_REDACT: ${OPA_REDACT:-1}
      OPA_HUB_URL: http://hub:8080
      OPA_HUB_ENROLL_TOKEN: ${OPA_HUB_ENROLL_TOKEN:-}
      OPA_ORGANIZATION_ID: ${OPA_ORGANIZATION_ID:-nas}
      OPA_PROJECT_ID: ${OPA_PROJECT_ID:-infra}
      OPA_AGENT_ID: ${OPA_AGENT_ID:-nas-edge-1}
      # Same ClickHouse as hub so edge ingest (PHP / collector :9090) keeps
      # writing full telemetry while the agent also registers with the hub.
      CLICKHOUSE_URL: "http://clickhouse:8123"
      # Alert delivery — SMTP credentials stay on the agent host (.env), not in
      # ClickHouse. Without OPA_SMTP_HOST, email actions record status=logged.
      OPA_ALERT_NOTIFY_MODE: ${OPA_ALERT_NOTIFY_MODE:-deliver}
      OPA_SMTP_HOST: ${OPA_SMTP_HOST:-}
      OPA_SMTP_PORT: ${OPA_SMTP_PORT:-587}
      OPA_SMTP_USER: ${OPA_SMTP_USER:-}
      OPA_SMTP_PASS: ${OPA_SMTP_PASS:-}
      OPA_SMTP_FROM: ${OPA_SMTP_FROM:-}
    ports:
      # Edge admin API (hub remains on 18080 for the public control-plane URL).
      - "18081:8080"
      - "2112:2112"
      - "8082:8082"
      - "9090:9090"
    networks:
      - open_internal
      - opa_network
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/api/health"]
      interval: 5s
      timeout: 3s
      retries: 20

  opa-dashboard:
    image: opa-dashboard:nas
    container_name: open_opa_dashboard
    restart: unless-stopped
    depends_on:
      hub:
        condition: service_healthy
    ports:
      - "8088:80"
    networks:
      - open_internal

  ora-api:
    image: ora-api:nas
    container_name: open_ora_api
    restart: unless-stopped
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      LISTEN_ADDR: ":8091"
      HTTP_ADDR: ":8091"
      CLICKHOUSE_URL: "http://clickhouse:8123"
      CLICKHOUSE_DB: ora
      JWT_SECRET: ${JWT_SECRET}
      AUTH_MODE: ${AUTH_MODE:-codeployed}
      # Prefer a distinct service secret from JWT_SECRET (set OPEN_SERVICE_JWT_SECRET in .env).
      OPEN_SERVICE_JWT_SECRET: ${OPEN_SERVICE_JWT_SECRET}
      OPA_AUTH_REQUIRED: ${OPA_AUTH_REQUIRED:-1}
      PEER_OPA_URL: http://hub:8080
      PEER_OAM_URL: http://oam-api:8090
      PEER_OSA_URL: http://osa-api:8093
      PEER_OPL_URL: http://opl-api:8092
      PEER_OPM_URL: http://opm-api:8096
      OPA_SECURITY_WORKSPACE: ${OPA_SECURITY_WORKSPACE:-/workspace}
      OPA_SCM_STATE_DIR: ${OPA_SCM_STATE_DIR:-/workspace/scm-state}
      OPA_REVIEW_TMP: ${OPA_REVIEW_TMP:-/mnt/Apps/config-docker/open-stack/opa-jobs}
      OPA_REVIEW_BROWSER_MCP: ${OPA_REVIEW_BROWSER_MCP:-1}
      OPA_REVIEW_BROWSER_DEPS_OK: ${OPA_REVIEW_BROWSER_DEPS_OK:-1}
      OPA_CURSOR_AGENT_BIN: /usr/local/bin/agent
      OPA_SCM_MOCK_GITHUB: ${OPA_SCM_MOCK_GITHUB:-0}
      SKIP_CURSOR_AI: ${SKIP_CURSOR_AI:-0}
      OPA_JOB_SANDBOX: ${OPA_JOB_SANDBOX:-off}
      OPA_JOB_IMAGE_TAG: nas
      OPA_JOB_EGRESS_PROXY_IMAGE: ${OPA_JOB_EGRESS_PROXY_IMAGE:-open-egress-proxy:nas}
      OPA_JOB_IMAGE_ALLOW: ${OPA_JOB_IMAGE_ALLOW:-ora-runner-*,osa-runner-*,node:22*,mysql:8.4*,redis:7*,php:8.4*,hebabil/php-8.4-cli*}
      OPA_INSTANCE_ID: ${OPA_INSTANCE_ID:-nas-prod}
      OPA_GITHUB_APP_ID: ${OPA_GITHUB_APP_ID:-}
      # Installed App slug for reviewer requests. New installs: ora. Production NAS keeps
      # opa-ai-orchestrator via .env until the GitHub App is renamed — do not override blindly.
      OPA_GITHUB_APP_SLUG: ${OPA_GITHUB_APP_SLUG:-ora}
      OPA_GITHUB_APP_PRIVATE_KEY: ${OPA_GITHUB_APP_PRIVATE_KEY}
      OPA_GITHUB_WEBHOOK_SECRET: ${OPA_GITHUB_WEBHOOK_SECRET}
      OPA_SCM_ALLOW_UNSIGNED: ${OPA_SCM_ALLOW_UNSIGNED:-0}
      OPA_PUBLIC_URL: ${OPA_PUBLIC_URL:-https://ai-orchestrator.clouded.fr}
      ORA_PUBLIC_URL: ${ORA_PUBLIC_URL:-https://ai-orchestrator.clouded.fr}
      OPA_DASHBOARD_URL: ${OPA_DASHBOARD_URL:-http://192.168.100.101:8088}
      OPA_SCM_CRON: ${OPA_SCM_CRON:-1}
      OPA_GITLEAKS_CONFIG: /etc/opa/gitleaks.toml
      # AES-GCM for connector ciphertext. MUST be distinct from JWT_SECRET.
      # Must match OAM_SECRET_KEY (or leave OAM_SECRET_KEY unset so it falls back here).
      # Required in .env — compose fails closed if unset (do not alias to JWT_SECRET).
      # If ciphertext was encrypted under the old JWT alias, set this to that same
      # historical value until you rotate/re-encrypt, then recreate ora-api + oam-api.
      OPA_CONNECTOR_SECRET: ${OPA_CONNECTOR_SECRET:?set OPA_CONNECTOR_SECRET in .env — distinct from JWT_SECRET}
      # Sibling module sources for OPA Checkup. Family services pin shared
      # libraries with go.mod filesystem replaces (../Open-Auth-Go); without
      # this the isolated job checkout cannot compile and the check reports
      # "could not run". Same path inside and out so job binds resolve.
      OPA_CHECKUP_MODULE_SRC: ${OPA_CHECKUP_MODULE_SRC:-/mnt/Apps/config-docker/open-stack/src}
      # How long the AppSec Gate waits for the OSA security run to finish.
      OPA_GATE_WAIT_TIMEOUT_SEC: ${OPA_GATE_WAIT_TIMEOUT_SEC:-600}
    volumes:
      - ora_workspace:/workspace
      - /var/run/docker.sock:/var/run/docker.sock
      - /mnt/Apps/config-docker/open-stack/opa-jobs:/mnt/Apps/config-docker/open-stack/opa-jobs
      # Read-only: Checkup copies replace targets into the job layout, never writes here.
      - /mnt/Apps/config-docker/open-stack/src:/mnt/Apps/config-docker/open-stack/src:ro
      - ./secrets/github-app.private-key.pem:/run/secrets/github-app.private-key.pem:ro
    ports:
      - "8091:8091"
    networks:
      - open_internal
      - opa_network
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8091/api/health"]
      interval: 5s
      timeout: 3s
      retries: 20

  ora-orchestrator:
    image: ora-api:nas
    container_name: open_ora_orchestrator
    restart: unless-stopped
    command: ["ora-api", "orchestrator"]
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      CLICKHOUSE_URL: "http://clickhouse:8123"
      CLICKHOUSE_DB: ora
      JWT_SECRET: ${JWT_SECRET}
      OPA_JOB_IMAGE_TAG: nas
      OPA_JOB_EGRESS_PROXY_IMAGE: ${OPA_JOB_EGRESS_PROXY_IMAGE:-open-egress-proxy:nas}
    volumes:
      - ora_workspace:/workspace
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - open_internal

  ora-dashboard:
    image: ora-dashboard:nas
    container_name: open_ora_dashboard
    restart: unless-stopped
    depends_on:
      - ora-api
    ports:
      - "8089:80"
    networks:
      - open_internal

  osa-api:
    image: osa-api:nas
    container_name: open_osa_api
    restart: unless-stopped
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      LISTEN_ADDR: ":8093"
      CLICKHOUSE_URL: "http://clickhouse:8123"
      CLICKHOUSE_DB: osa
      JWT_SECRET: ${JWT_SECRET}
      AUTH_MODE: ${AUTH_MODE:-codeployed}
      # Prefer a distinct service secret from JWT_SECRET (set OPEN_SERVICE_JWT_SECRET in .env).
      OPEN_SERVICE_JWT_SECRET: ${OPEN_SERVICE_JWT_SECRET}
      OPA_AUTH_REQUIRED: ${OPA_AUTH_REQUIRED:-1}
      PEER_OPA_URL: http://hub:8080
      PEER_ORA_URL: http://ora-api:8091
      # The dashboard's project picker reads /api/oam/projects, which proxies
      # OAM's directory. Organizations still come via the hub. Unset, the project
      # picker is empty rather than broken.
      PEER_OAM_URL: http://oam-api:8090
      OPA_JOB_SANDBOX: ${OPA_JOB_SANDBOX:-off}
      OSA_RUNNER_TAG: nas
      OPA_JOB_IMAGE_TAG: nas
      OPA_JOB_EGRESS_PROXY_IMAGE: ${OPA_JOB_EGRESS_PROXY_IMAGE:-open-egress-proxy:nas}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8093:8093"
    networks:
      - open_internal
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8093/api/health"]
      interval: 5s
      timeout: 3s
      retries: 20

  osa-orchestrator:
    image: osa-api:nas
    container_name: open_osa_orchestrator
    restart: unless-stopped
    command: ["osa-api", "orchestrator"]
    environment:
      CLICKHOUSE_URL: "http://clickhouse:8123"
      CLICKHOUSE_DB: osa
      OSA_RUNNER_TAG: nas
      OPA_JOB_IMAGE_TAG: nas
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - open_internal

  osa-dashboard:
    image: osa-dashboard:nas
    container_name: open_osa_dashboard
    restart: unless-stopped
    depends_on:
      - osa-api
    ports:
      - "8094:80"
    networks:
      - open_internal

  opl-api:
    image: opl-api:nas
    container_name: open_opl_api
    restart: unless-stopped
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      LISTEN_ADDR: ":8092"
      HTTP_ADDR: ":8092"
      CLICKHOUSE_URL: "http://clickhouse:8123"
      CLICKHOUSE_DB: opl
      JWT_SECRET: ${JWT_SECRET}
      AUTH_MODE: ${AUTH_MODE:-codeployed}
      # Prefer a distinct service secret from JWT_SECRET (set OPEN_SERVICE_JWT_SECRET in .env).
      OPEN_SERVICE_JWT_SECRET: ${OPEN_SERVICE_JWT_SECRET}
      OPA_AUTH_REQUIRED: ${OPA_AUTH_REQUIRED:-1}
      PEER_OPA_URL: http://hub:8080
      OPA_JOB_IMAGE_TAG: nas
      OPA_JMETER_IMAGE: ${OPA_JMETER_IMAGE:-justb4/jmeter:5.5}
      OPA_JMETER_WORK: /opa-jmeter
      OPA_JMETER_VOLUME: ${COMPOSE_PROJECT_NAME:-open-family}_jmeter_work
      OPA_JMETER_NETWORK: ${COMPOSE_PROJECT_NAME:-open-family}_open_internal
      # Terminal-run notification channels (optional — set in .env; never commit secrets)
      OPL_RUN_NOTIFY_MODE: ${OPL_RUN_NOTIFY_MODE:-deliver}
      OPL_RUN_NOTIFY_STATUSES: ${OPL_RUN_NOTIFY_STATUSES:-}
      OPL_RUN_NOTIFY_CHANNELS: ${OPL_RUN_NOTIFY_CHANNELS:-}
      OPL_RUN_WEBHOOK_URL: ${OPL_RUN_WEBHOOK_URL:-}
      OPL_RUN_WEBHOOK_SECRET: ${OPL_RUN_WEBHOOK_SECRET:-}
      OPL_RUN_CHAT_WEBHOOK_URL: ${OPL_RUN_CHAT_WEBHOOK_URL:-}
      OPL_RUN_EMAIL_TO: ${OPL_RUN_EMAIL_TO:-}
      OPL_RUN_EMAIL_FROM: ${OPL_RUN_EMAIL_FROM:-}
      # Shared SMTP relay (same block as the edge agent alert email)
      OPA_SMTP_HOST: ${OPA_SMTP_HOST:-}
      OPA_SMTP_PORT: ${OPA_SMTP_PORT:-}
      OPA_SMTP_USER: ${OPA_SMTP_USER:-}
      OPA_SMTP_PASS: ${OPA_SMTP_PASS:-}
      OPA_SMTP_FROM: ${OPA_SMTP_FROM:-}
      OPL_PUBLIC_URL: ${OPL_PUBLIC_URL:-}
    volumes:
      - jmeter_work:/opa-jmeter
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8092:8092"
    networks:
      - open_internal
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8092/api/health"]
      interval: 5s
      timeout: 3s
      retries: 20

  opl-orchestrator:
    image: opl-api:nas
    container_name: open_opl_orchestrator
    restart: unless-stopped
    command: ["opl-api", "orchestrator"]
    environment:
      CLICKHOUSE_URL: "http://clickhouse:8123"
      CLICKHOUSE_DB: opl
      OPA_JOB_IMAGE_TAG: nas
    volumes:
      - jmeter_work:/opa-jmeter
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - open_internal

  opl-dashboard:
    image: opl-dashboard:nas
    container_name: open_opl_dashboard
    restart: unless-stopped
    depends_on:
      - opl-api
    ports:
      - "8095:80"
    networks:
      - open_internal

  # OAM — Open Account Manager: the family's account, org and credential plane.
  # Orgs, users, connectors, API keys, AI provider credentials and per-agent model
  # bindings live here; every product reads them over HTTP.
  oam-api:
    image: oam-api:nas
    container_name: open_oam_api
    restart: unless-stopped
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      LISTEN_ADDR: ":8090"
      CLICKHOUSE_URL: "http://clickhouse:8123"
      CLICKHOUSE_DB: oam
      JWT_SECRET: ${JWT_SECRET}
      AUTH_MODE: ${AUTH_MODE:-codeployed}
      OPA_AUTH_REQUIRED: ${OPA_AUTH_REQUIRED:-1}
      # REQUIRED. Credential resolution refuses to serve without a service secret:
      # a peer that cannot be authenticated must not receive plaintext keys, and
      # that holds regardless of OPA_AUTH_REQUIRED.
      OPEN_SERVICE_JWT_SECRET: ${OPEN_SERVICE_JWT_SECRET}
      # Encrypts secrets at rest. MUST derive to the same bytes as the key ORA
      # already uses, because the migration copies ORA's ciphertext verbatim
      # rather than re-encrypting it. Defaulting to OPA_CONNECTOR_SECRET means an
      # existing install migrates with no new configuration; setting this to a
      # *different* value is the one change that makes migrated credentials
      # undecryptable (it fails closed and logs — it never returns garbage).
      OAM_SECRET_KEY: ${OAM_SECRET_KEY:-${OPA_CONNECTOR_SECRET}}
      PEER_OPA_URL: http://hub:8080
    ports:
      - "18090:8090"
    networks:
      - open_internal
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8090/api/health"]
      interval: 5s
      timeout: 3s
      retries: 20

  # The account console. This is where per-agent model bindings are configured, so
  # it is the surface that replaces the OPM_MODEL* environment variables — see
  # docs/config-reference.md.
  oam-dashboard:
    image: oam-dashboard:nas
    container_name: open_oam_dashboard
    restart: unless-stopped
    depends_on:
      - oam-api
    ports:
      - "18097:80"
    networks:
      - open_internal

  opm-api:
    image: opm-api:nas
    container_name: open_opm_api
    restart: unless-stopped
    environment:
      LISTEN_ADDR: ":8096"
      JWT_SECRET: ${JWT_SECRET}
      AUTH_MODE: ${AUTH_MODE:-codeployed}
      # Prefer a distinct service secret from JWT_SECRET (set OPEN_SERVICE_JWT_SECRET in .env).
      OPEN_SERVICE_JWT_SECRET: ${OPEN_SERVICE_JWT_SECRET}
      OPA_AUTH_REQUIRED: ${OPA_AUTH_REQUIRED:-1}
      PEER_OPA_URL: http://hub:8080
      PEER_ORA_URL: http://ora-api:8091
      OPM_RUNNER_TAG: nas
      OPM_DATA_DIR: /data
      # Must be the same host path inside and outside the container: docker run -v
      # from opm-api uses the Docker host's path view. A named volume at /tmp/opm-jobs
      # made runner /repo mounts empty. Mirror ORA's opa-jobs host-bind pattern.
      OPM_JOB_TMP: /mnt/Apps/config-docker/open-stack/opm-jobs
      # Models and API keys resolve PER JOB from OAM: scoped to the acting user's
      # org and the per-agent binding for that job's phase, so "light model to
      # plan, strong model to implement" is configurable per org or per user
      # instead of per deployment. A job whose org has no credential fails closed
      # with credential_unavailable rather than borrowing a deployment-wide key.
      PEER_OAM_URL: http://oam-api:8090
      # LEGACY model path — used only when PEER_OAM_URL is unset. Kept so a
      # deployment can roll back to the pre-OAM behaviour without a code change.
      # These no longer participate while OAM is configured; the console's
      # Agents & Models page is where model choice lives now.
      OPM_MODEL_API_KEY: ${OPM_MODEL_API_KEY:-}
      OPM_MODEL_BASE_URL: ${OPM_MODEL_BASE_URL:-}
      OPM_MODEL: ${OPM_MODEL:-auto}
      OPM_MODEL_PLANNING: ${OPM_MODEL_PLANNING:-auto}
      OPM_MODEL_CODING: ${OPM_MODEL_CODING:-auto}
      OPM_MODEL_REVIEW: ${OPM_MODEL_REVIEW:-auto}
      OPM_MODEL_IDEATION: ${OPM_MODEL_IDEATION:-auto}
      OPM_MODEL_ROADMAP_DISCOVERY: ${OPM_MODEL_ROADMAP_DISCOVERY:-auto}
      OPM_MODEL_ROADMAP_FEATURES: ${OPM_MODEL_ROADMAP_FEATURES:-auto}
      OPM_RUNNER_NETWORK: ${OPM_RUNNER_NETWORK:-bridge}
      # Connector storage is OAM; GitHub App/PAT protocol + short-lived SCM creds are on ora-api.
      # OPM discovers orgs via PEER_OPA_URL, models/keys via PEER_OAM_URL, SCM via PEER_ORA_URL.
    volumes:
      - opm_data:/data
      - /mnt/Apps/config-docker/open-stack/opm-jobs:/mnt/Apps/config-docker/open-stack/opm-jobs
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8096:8096"
    networks:
      - open_internal
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8096/api/health"]
      interval: 5s
      timeout: 3s
      retries: 20

  opm-orchestrator:
    image: opm-api:nas
    container_name: open_opm_orchestrator
    restart: unless-stopped
    command: ["opm-api", "orchestrator"]
    environment:
      ORCHESTRATOR_LISTEN_ADDR: ":8099"
      OPM_RUNNER_TAG: nas
      OPM_DATA_DIR: /data
      OPM_MODEL_API_KEY: ${OPM_MODEL_API_KEY:-}
      OPM_MODEL_BASE_URL: ${OPM_MODEL_BASE_URL:-}
      OPM_MODEL: ${OPM_MODEL:-auto}
    volumes:
      - opm_data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - open_internal

  opm-dashboard:
    image: opm-dashboard:nas
    container_name: open_opm_dashboard
    restart: unless-stopped
    depends_on:
      - opm-api
    ports:
      - "8098:80"
    networks:
      - open_internal

  open-egress-proxy:
    image: open-egress-proxy:nas
    container_name: open_egress_proxy
    restart: unless-stopped
    networks:
      - open_internal
      - opa_network

  # Host metrics collector — the single definition of this service. It runs as
  # uid/gid 65534 (scratch image, no shell), so container collection needs the
  # host docker group added explicitly to read /var/run/docker.sock. Set
  # OPA_DOCKER_GID in the stack .env when the host docker group is not 999
  # (`getent group docker`) instead of editing this file.
  collector:
    image: opa-collector:nas
    container_name: open_collector
    restart: unless-stopped
    network_mode: host
    pid: host
    group_add:
      - "${OPA_DOCKER_GID:-999}"
    depends_on:
      opa_agent:
        condition: service_healthy
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /sys/fs/cgroup:/host/cgroup:ro
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      OPA_AGENT_ADDR: "127.0.0.1:9090"
      OPA_PROC_PATH: "/host/proc"
      OPA_SYS_PATH: "/host/sys"
      OPA_CGROUP_PATH: "/host/cgroup"
      OPA_ORGANIZATION_ID: "nas"
      OPA_PROJECT_ID: "infra"
      OPA_ENVIRONMENT: "production"
      OPA_HOST: "truenas2012"
      OPA_COLLECT_INTERVAL: "30s"
      OPA_PER_CORE_CPU: "false"
      OPA_COLLECT_CONTAINERS: "true"
      OPA_COLLECT_PROCESSES: "true"
      OPA_PROCESS_TOP_N: "25"

volumes:
  # Preserve production ClickHouse + legacy orchestrator workspace volumes.
  clickhouse_data:
    external: true
    name: opa-stack_opa_clickhouse_data
  ora_workspace:
    external: true
    name: opa-stack_opa_orchestrator_workspace
  jmeter_work:
  opm_data:

networks:
  open_internal:
    driver: bridge
  opa_network:
    external: true
    name: opa_network
